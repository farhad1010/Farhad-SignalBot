name: Farhad SignalBot - Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify project
        run: |
          echo "=== Project files ==="
          ls -la
          echo "=== Gradle version ==="
          gradle --version
          echo "=== Android module ==="
          test -f app/build.gradle.kts
          echo "Project verification passed."

      - name: Build Debug APK
        env:
          MARKET_API_KEY: ${{ secrets.MARKET_API_KEY }}
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            -PMARKET_API_KEY="$MARKET_API_KEY" \
            :app:assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          echo "APK build completed successfully."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Farhad-SignalBot-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
